[project]
name = "anemiaiaback"
version = "0.1.0"
description = "FastAPI service for palpebral conjunctiva extraction and capture storage"
authors = [{ name = "externo455", email = "externo455@compartamos.pe" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
anemiaiaback = "anemiaiaback.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL and a reachable PostgreSQL database"]
